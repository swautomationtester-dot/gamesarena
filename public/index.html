<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060914">
<meta name="description" content="GamesArena — Play • Think • Win • Live">
<title>GamesArena • Play • Think • Win</title>
<link rel="stylesheet" href="/style.css?v=20260812-home-final-1">
<link rel="stylesheet" href="/gamesarena-home.css?v=20260812-home-final-1">
<link rel="stylesheet" href="/common-ui.css?v=20260812-showcase-final-2">
</head>
<body class="gaHome">

<main class="gaHomeMain">
  <section class="gaHero" aria-labelledby="welcomeTitle">
    <div class="gaHeroContent">
      <div class="gaKicker"><span></span> GAMESARENA • LIVE PLAY PLATFORM <span></span></div>
      <h1 id="welcomeTitle">Welcome to <em>GamesArena</em></h1>
      <p class="gaTagline">Play <b>•</b> Think <b>•</b> Win <b>•</b> Live</p>
      <p class="gaSubtitle">Step into a modern live gaming arena built for quiz shows, team challenges and unforgettable events.</p>
      <div class="gaActions">
        <a class="gaExplore" href="/games.html">Explore Games <span>→</span></a>
        <a class="gaPayments" href="/payment.html">Payments <span>↗</span></a>
      </div>
    </div>
    <div class="gaHeroVisual" aria-hidden="true">
      <div class="gaHalo halo1"></div>
      <div class="gaHalo halo2"></div>
      <div class="gaOrbit orbit1"><i></i></div>
      <div class="gaOrbit orbit2"><i></i></div>
      <div class="gaLogoCore">
        <div class="gaCoreGlow"></div>
        <img src="/assets/gamesarena-logo-premium.png" alt="">
      </div>
    </div>
  </section>
</main>


<script>
(() => {
  const button = document.querySelector('.gaMenuToggle');
  const nav = document.querySelector('#gaNav');
  if (!button || !nav) return;
  button.addEventListener('click', () => {
    const open = nav.classList.toggle('isOpen');
    button.setAttribute('aria-expanded', String(open));
    button.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  });
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('isOpen');
    button.setAttribute('aria-expanded', 'false');
    button.setAttribute('aria-label', 'Open navigation');
  }));
})();
</script>
<script src="/common-ui.js?v=20260812-showcase-final-2"></script>
</body>
</html>
